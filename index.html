<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Profesional</title>
    <!-- Importando tipografías modernas desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0f172a;        /* Azul marino oscuro */
            --navy-light: #1e3a8a;  /* Azul marino brillante */
            --light: #f8fafc;
            --gray: #64748b;
        }
        /* Comportamiento de desplazamiento suave para los botones */
        html { scroll-behavior: smooth; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; padding: 0; 
            background: var(--light); 
            color: var(--navy); 
        }
        
        /* Menú de Navegación Superior */
        nav { 
            position: fixed; top: 0; left: 0; width: 100%; 
            background: rgba(255,255,255,0.95); 
            backdrop-filter: blur(10px); 
            z-index: 1000; 
            border-bottom: 1px solid #e2e8f0; 
            display: flex; justify-content: center; 
            padding: 20px 0; gap: 40px; 
            font-family: 'Montserrat', sans-serif;
            font-weight: 700; font-size: 0.85rem; 
            text-transform: uppercase; letter-spacing: 1px; 
        }
        nav a { text-decoration: none; color: var(--navy); transition: color 0.3s; }
        nav a:hover { color: var(--navy-light); }

        /* Contenedor general de secciones */
        section { padding: 120px 5%; max-width: 1300px; margin: 0 auto; }
        
        /* Sección Inicio (Ocupa toda la pantalla 100vh) */
        #inicio { 
            min-height: 100vh; 
            display: flex; flex-direction: column; justify-content: center; 
            position: relative; padding-top: 80px; box-sizing: border-box; 
        }
        .hero-title { 
            font-family: 'Montserrat', sans-serif; 
            font-size: clamp(4rem, 10vw, 9rem); 
            font-weight: 900; line-height: 0.85; 
            text-transform: uppercase; letter-spacing: -3px; 
            margin: 0; color: var(--navy); 
        }
        .hero-subtitle { 
            font-family: 'Montserrat', sans-serif; 
            font-size: 1.2rem; color: var(--navy-light); 
            font-weight: 700; margin-top: 30px; 
            text-transform: uppercase; letter-spacing: 3px; 
        }
        .hero-desc { font-size: 1.2rem; max-width: 700px; color: var(--gray); margin-top: 25px; line-height: 1.8; }
        
        /* Botón flotante animado para bajar */
        .scroll-down { 
            position: absolute; bottom: 40px; left: 50%; 
            transform: translateX(-50%); text-decoration: none; 
            color: var(--navy); font-size: 2.5rem; 
            animation: bounce 2s infinite; 
        }
        @keyframes bounce { 
            0%, 20%, 50%, 80%, 100% { transform: translateY(0) translateX(-50%); } 
            40% { transform: translateY(-20px) translateX(-50%); } 
            60% { transform: translateY(-10px) translateX(-50%); } 
        }

        /* Títulos de cada sección */
        .section-title { 
            font-family: 'Montserrat', sans-serif; font-size: 2rem; 
            font-weight: 900; border-bottom: 3px solid var(--navy); 
            padding-bottom: 15px; margin-bottom: 60px; 
            text-transform: uppercase; letter-spacing: -1px; 
        }

        /* Sistema de Cuadrícula (Grid) para Tarjetas */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px; }
        
        /* Diseño de Tarjetas (Experiencia y Proyectos) */
        .card { 
            background: white; padding: 40px; 
            border-top: 4px solid var(--navy-light); 
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05); 
            transition: all 0.3s ease; position: relative; 
        }
        .card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(15, 23, 42, 0.1); }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        
        /* Logos */
        .card-logo { 
            width: 60px; height: 60px; object-fit: contain; 
            background: #fff; border-radius: 8px; 
        }
        .project-number { 
            font-family: 'Montserrat', sans-serif; font-size: 2rem; 
            font-weight: 900; color: #e2e8f0; line-height: 1; 
        }
        
        .card-title { font-family: 'Montserrat', sans-serif; font-size: 1.4rem; font-weight: 800; margin: 0 0 10px 0; }
        .card-meta { font-size: 0.85rem; color: var(--navy-light); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
        .card-desc { font-size: 1rem; color: var(--gray); line-height: 1.7; margin-top: 20px; }

        /* Diseño Logros */
        .logro-box { background: white; padding: 30px; border-left: 5px solid var(--navy-light); margin-bottom: 20px; font-size: 1.1rem; line-height: 1.6; font-weight: 400;}

        /* Diseño Habilidades */
        .skills-wrapper { display: flex; flex-wrap: wrap; gap: 15px; }
        .skill-tag { 
            border: 2px solid var(--navy); color: var(--navy); 
            padding: 12px 25px; font-weight: 700; 
            font-family: 'Montserrat', sans-serif; 
            text-transform: uppercase; font-size: 0.85rem; 
            transition: all 0.3s; cursor: default;
        }
        .skill-tag:hover { background: var(--navy); color: white; }

        /* Pie de página (Footer) con botón de subir */
        footer { background: var(--navy); color: white; text-align: center; padding: 80px 20px; margin-top: 80px; }
        .btn-top { 
            display: inline-block; background: white; color: var(--navy); 
            padding: 15px 40px; text-decoration: none; 
            font-family: 'Montserrat', sans-serif; font-weight: 800; 
            text-transform: uppercase; letter-spacing: 2px; 
            margin-top: 40px; transition: all 0.3s; border-radius: 50px; 
        }
        .btn-top:hover { background: var(--navy-light); color: white; }
    </style>
</head>
<body>
    <!-- Navegación Superior -->
    <nav>
        <a href="#proyectos">Proyectos</a>
        <a href="#experiencia">Experiencia</a>
        <a href="#logros">Logros</a>
        <a href="#habilidades">Habilidades</a>
    </nav>

    <!-- Sección Inicio (Pantalla Completa) -->
    <section id="inicio">
        <div id="header-content">Cargando...</div>
        <!-- Botón flotante animado -->
        <a href="#proyectos" class="scroll-down">↓</a>
    </section>

    <!-- Sección Proyectos -->
    <section id="proyectos">
        <h2 class="section-title">Proyectos Destacados</h2>
        <div id="proyectos-grid" class="grid"></div>
    </section>

    <!-- Sección Experiencia -->
    <section id="experiencia">
        <h2 class="section-title">Impacto & Experiencia</h2>
        <div id="experiencias-grid" class="grid"></div>
    </section>

    <!-- Sección Logros -->
    <section id="logros">
        <h2 class="section-title">Logros Clave</h2>
        <div id="logros-list"></div>
    </section>

    <!-- Sección Habilidades -->
    <section id="habilidades">
        <h2 class="section-title">Toolkit & Habilidades</h2>
        <div id="habilidades-list" class="skills-wrapper"></div>
    </section>

    <!-- Footer -->
    <footer>
        <h2 style="font-family: 'Montserrat', sans-serif; font-size: 3rem; margin: 0; text-transform: uppercase;">Edwin Hualtibamba</h2>
        <p style="color: #94a3b8; margin-top: 10px; font-size: 1.1rem;">Diseñando experiencias y procesos digitales eficientes.</p>
        <a href="#inicio" class="btn-top">Volver Arriba ↑</a>
    </footer>

    <!-- Lógica JavaScript -->
    <script>
        fetch('cv_data.json')
            .then(response => response.json())
            .then(data => {
                
 // 1. Renderizar Perfil
                document.getElementById('header-content').innerHTML = `
                    <h1 class="hero-title">${data.perfil.nombre}</h1>
                    <div class="hero-subtitle">${data.perfil.titulo}</div>
                    <p class="hero-desc">${data.perfil.descripcion}</p>
                `;
                // 2. Renderizar Proyectos con Números y Logos
                const proyContainer = document.getElementById('proyectos-grid');
                data.proyectos.forEach((proy, index) => {
                    const numero = String(index + 1).padStart(2, '0');
                    const logoHtml = proy.logo ? `<img src="${proy.logo}" class="card-logo" alt="Logo Cliente">` : '';
                    
                    proyContainer.innerHTML += `
                        <div class="card">
                            <div class="card-header">
                                ${logoHtml}
                                <span class="project-number">${numero}</span>
                            </div>
                            <h3 class="card-title">${proy.nombre}</h3>
                            <div class="card-meta">Cliente: ${proy.cliente}</div>
                            <p class="card-desc">${proy.descripcion}</p>
                        </div>
                    `;
                });

                // 3. Renderizar Experiencia con Logos
                const expContainer = document.getElementById('experiencias-grid');
                data.experiencias.forEach(exp => {
                    const logoHtml = exp.logo ? `<img src="${exp.logo}" class="card-logo" alt="Logo Empresa">` : '';
                    
                    expContainer.innerHTML += `
                        <div class="card">
                            <div class="card-header">
                                ${logoHtml}
                            </div>
                            <h3 class="card-title">${exp.puesto}</h3>
                            <div class="card-meta">${exp.empresa} &nbsp;|&nbsp; ${exp.fecha}</div>
                            <p class="card-desc">${exp.detalles}</p>
                        </div>
                    `;
                });

                // 4. Renderizar Logros
                const logrosContainer = document.getElementById('logros-list');
                data.logros.forEach(logro => {
                    logrosContainer.innerHTML += `<div class="logro-box">${logro}</div>`;
                });

                // 5. Renderizar Habilidades
                const habContainer = document.getElementById('habilidades-list');
                data.habilidades.forEach(habilidad => {
                    habContainer.innerHTML += `<div class="skill-tag">${habilidad}</div>`;
                });

            })
            .catch(error => console.error('Error cargando los datos:', error));
    </script>
</body>
</html>
