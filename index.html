<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Minimalista | Edwin Hualtibamba</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f7f9fa; 
            color: #1a1a1a; 
            line-height: 1.6; 
            padding: 50px 20px; 
            max-width: 700px; 
            margin: 0 auto; 
        }
        h1 { font-size: 2.2em; margin-bottom: 5px; font-weight: 700; letter-spacing: -0.5px; }
        h2 { font-size: 1.1em; font-weight: 400; color: #555; margin-top: 0; border-bottom: 1px solid #eaeaea; padding-bottom: 25px; margin-bottom: 40px; }
        h3 { font-size: 1.4em; font-weight: 600; margin-top: 40px; margin-bottom: 20px; border-bottom: 2px solid #1a1a1a; display: inline-block; padding-bottom: 5px;}
        
        /* Estilos de Experiencia y Proyectos */
        .tarjeta { 
            background: #ffffff; 
            padding: 25px 30px; 
            border-radius: 12px; 
            border: 1px solid #eaeaea;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02); 
            margin-bottom: 20px; 
            transition: transform 0.2s ease;
        }
        .tarjeta:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.05); }
        .titulo-tarjeta { font-size: 1.2em; font-weight: 600; margin: 0 0 5px 0; color: #111; }
        .meta { color: #666; font-size: 0.9em; margin-bottom: 10px; font-weight: 500; }
        .cliente { color: #2563eb; font-size: 0.9em; font-weight: 600; margin-bottom: 10px; display: inline-block; background: #eff6ff; padding: 2px 10px; border-radius: 6px;}
        .detalles { margin: 0; color: #444; font-size: 0.95em; }
        
        /* Estilos de Logros */
        .logro-item { 
            background: #f0fdf4; 
            border-left: 4px solid #22c55e; 
            padding: 15px 20px; 
            margin-bottom: 15px; 
            border-radius: 0 8px 8px 0; 
            color: #166534; 
            font-size: 0.95em;
        }

        /* Estilos de Habilidades */
        .skills-container { display: flex; flex-wrap: wrap; gap: 10px; }
        .skill-tag { 
            background-color: #e2e8f0; 
            color: #334155; 
            padding: 8px 15px; 
            border-radius: 20px; 
            font-size: 0.85em; 
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div id="header">Cargando perfil...</div>
    
    <h3>Logros Destacados</h3>
    <div id="logros"></div>

    <h3>Proyectos a cargo</h3>
    <div id="proyectos"></div>

    <h3>Experiencia Profesional</h3>
    <div id="experiencias"></div>

    <h3>Habilidades</h3>
    <div id="habilidades" class="skills-container"></div>

    <script>
        fetch('cv_data.json')
            .then(response => response.json())
            .then(data => {
                // Perfil
                document.getElementById('header').innerHTML = `
                    <h1>${data.perfil.nombre}</h1>
                    <h2>${data.perfil.titulo} | ${data.perfil.descripcion}</h2>
                `;
                
                // Logros
                const logrosContainer = document.getElementById('logros');
                data.logros.forEach(logro => {
                    logrosContainer.innerHTML += `<div class="logro-item">✨ ${logro}</div>`;
                });

                // Proyectos
                const proyContainer = document.getElementById('proyectos');
                data.proyectos.forEach(proy => {
                    proyContainer.innerHTML += `
                        <div class="tarjeta">
                            <p class="titulo-tarjeta">${proy.nombre}</p>
                            <span class="cliente">Cliente: ${proy.cliente}</span>
                            <p class="detalles">${proy.descripcion}</p>
                        </div>
                    `;
                });

                // Experiencias
                const expContainer = document.getElementById('experiencias');
                data.experiencias.forEach(exp => {
                    expContainer.innerHTML += `
                        <div class="tarjeta">
                            <p class="titulo-tarjeta">${exp.puesto}</p>
                            <p class="meta">${exp.empresa} &nbsp;•&nbsp; ${exp.fecha}</p>
                            <p class="detalles">${exp.detalles}</p>
                        </div>
                    `;
                });

                // Habilidades
                const habContainer = document.getElementById('habilidades');
                data.habilidades.forEach(habilidad => {
                    habContainer.innerHTML += `<span class="skill-tag">${habilidad}</span>`;
                });
            })
            .catch(error => console.error('Error cargando los datos:', error));
    </script>
</body>
</html>
